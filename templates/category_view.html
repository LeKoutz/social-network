{{define "category_view"}}
{{ template "header" .}}
{{template "topbar" .}}
{{if .Error.Has}}
    {{template "error" .}}
{{end}}
<div class="container">
    {{template "category" index .Categories 0}}
    {{ range .Posts }}
        {{ template "post" . }}
    {{ end }}
</div>
{{template "ending" .}}
{{end}}
